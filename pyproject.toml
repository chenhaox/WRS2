[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'wrs'
version = '0.1.0'
description = 'A lightweight robot motion planning and learning framework.'
readme = 'README.md'
requires-python = '>=3.12'
dependencies = [
    'numpy',
    'scipy',
    'mujoco',
    'xacro',
    'urdf_parser_py',
    'wgpu',
    'rendercanvas',
    'glfw',
    'websockets>=14',
]

[tool.setuptools.packages.find]
include = ['one*', 'wrs*']

[tool.setuptools.package-data]
'wrs.assembly.visualization' = ['_contact_viewer.html']

[project.optional-dependencies]
assembly-sdf = ['open3d>=0.19']
assembly-planning = ['clarabel>=0.11.1']
