<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WRS · 接触几何实验</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f4f5f7;color:#172b3d;font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}

</style>
<header><div class="brand">WRS / 接触几何实验<span class="tag">ASSEMBLY PLANNER · M1</span></div><small>真实表面 · 区域与间隙</small></header>
<main><aside><small>选择解析案例</small><select id="cases" aria-label="选择案例"></select><h1 id="title"></h1><p id="desc"></p>
<div class="metric" id="activemetric"><span>实际接触面积 / active</span><b id="area"></b></div><div class="metric"><span>全局实体关系</span><b id="overlap"></b></div>

<div class="metric"><span>当前侧候选近接带面积</span><b id="neararea"></b></div>
<div class="metric" id="policymetric" hidden><span>当前侧容差接触面积</span><b id="policyarea"></b></div>
<div class="metric" id="regionmetric" hidden><span>穿入表面 A / B</span><b id="regionarea"></b></div>
<div class="metric" id="regiontimemetric" hidden><span>区域提取耗时</span><b id="regiontime"></b></div>
<div class="metric" title="接触分析耗时，不含文件读取、报告写入和渲染；缓存只复用几何，仍重新计算区域。"><span id="timinglabel">后端计算耗时</span><b id="duration"></b></div>
<div class="note" id="coverage" role="status"></div>
<div class="note" id="sideinfo" role="status"></div>
<div class="note" id="colorinfo" role="status"></div>
<details><summary>查看区域证据</summary><div id="patches"></div><pre id="detail"></pre></details>
</aside><section><div class="toolbar"><button id="iso">立体视图</button><button id="top">俯视</button><button id="bottom">底视</button><label><input id="meshes" type="checkbox" checked>零件</label><label><input id="sourceonly" type="checkbox">仅当前侧零件</label><label><input id="normals" type="checkbox">法线</label><label><input id="boundaries" type="checkbox" checked>边界</label><label title="取消显示 A 面结果；勾选显示 B 面结果。只切换显示，不会重新采样或提高精度。"><input id="sideb" type="checkbox">显示 B 面结果</label></div>
<canvas id="view" aria-label="可拖动旋转的三维接触区域"></canvas><div class="legend"><span><i class="dot" style="background:#078b70"></i>active</span><span><i class="dot" style="background:#e89420"></i>near</span><span><i class="dot" style="background:#d74850"></i>interference</span><span><i class="dot" style="background:#8466b4"></i>unknown</span></div><div class="hint">拖动旋转 · 滚轮缩放 · 点击左侧区域查看来源与间隙 · 显示单位 mm</div></section></main>
<script id="data" type="application/json">__ASSEMBLY_DATA__</script>
<script>

 el('regionarea').textContent=penetration?penetration.sides.map(s=>s.status==='unavailable'?'不可判':(s.area_m2*1e6).toFixed(2)).join(' / ')+' mm²':'';

 el('sideinfo').textContent=penetration?'红色填充是零件表面穿入另一实体内部的部分；A/B 独立提取，可双侧显示。它是表面区域，不是交集体积，也不是接触面积。':'本例尚未发现穿透证据，因此没有提取穿入表面。unknown 仍不能解释为已证明分离。';

}

el('policymetric').hidden=!policy;el('policylegend').hidden=!policy||!el('policyview').checked;
if(policy){
 const area=visible.filter(accepted).reduce((s,p)=>s+p.area_m2,0);

 el('policymetric').title='按显式装配规则接受的当前侧区域面积；不改变实际 active 面积或实体相交关系。';
 el('sideinfo').textContent+=' 接触容差 '+(policy.contact_tol_m*1000).toFixed(3)+' mm。';
 if(el('policyview').checked)el('colorinfo').textContent='蓝色表示按容差接受的装配接触。原始几何分类保留；紫色边界表示该蓝面采用了无符号距离假设。关闭「容差接触显示」可恢复原始颜色。'+(unsigned&&!el('unsignedpolicy').checked?' 无符号区域尚未接受，仍为紫色 unknown。':'');
}
const shownParts=new Set(current.analysis.pair_diagnostics.map(d=>side==='a'?d.part_a:d.part_b));if(el('meshes').checked)current.meshes.filter(m=>!el('sourceonly').checked||shownParts.has(m.id)).forEach((m,i)=>m.faces.forEach(f=>commands.push({ps:f.map(j=>project(m.vertices[j])),fill:i%2?'#819ebc':'#bac7d2',alpha:.1,line:'#8a9dab',width:.3})));
current.analysis.patches.forEach((p,i)=>{if(p.measure_kind==='near_band'&&p.sampling_side!==(el('sideb').checked?'b':'a'))return;const opacity=selected<0||selected===i?.74:.13;
p.regions.forEach(r=>{r.cells_world_m.forEach(c=>commands.push({ps:c.map(project),fill:fillColor(p),alpha:opacity,line:null,width:2}));if(el('boundaries').checked)r.boundary_loops_world_m.forEach(c=>commands.push({ps:[...c,c[0]].map(project),line:accepted(p)&&p.provenance?.distance_interval!=='unsigned'?fillColor(p):colors[p.classification],alpha:.95,width:2,loop:true}));});

commands.sort((a,b)=>a.ps.reduce((s,p)=>s+p[2],0)/a.ps.length-b.ps.reduce((s,p)=>s+p[2],0)/b.ps.length);

ctx.globalAlpha=1;ctx.fillStyle='#637684';ctx.font='12px system-ui';ctx.fillText('X / Y / Z · mm',20,h-20);
const origin=project(center);[['X',[1,0,0],'#c65a64'],['Y',[0,1,0],'#569573'],['Z',[0,0,1],'#5188b9']].forEach(([name,axis,color])=>{const p=project(add(center,axis.map(x=>x*span*.11)));const a=[w-90,h-72],b=[a[0]+p[0]-origin[0],a[1]+p[1]-origin[1]];path([a,b]);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=color;ctx.fillText(name,b[0]+4,b[1]);});}

const timings=a.statistics?.timing_s?[a.statistics.timing_s]:(a.statistics?.pairs||[]).map(p=>p.timing_s).filter(Boolean),seconds=current.benchmark?.warm_median_s??(timings.length?timings.reduce((s,t)=>s+t.backend_total,0):null);el('timinglabel').textContent=current.benchmark?'缓存复用耗时 / 中位数':'后端计算耗时';el('duration').textContent=seconds===null?'未记录':seconds.toFixed(3)+' s';
const hasSDF=a.pair_diagnostics.some(d=>d.contact_backend==='sdf'),zero=hasSDF&&a.pair_diagnostics.every(d=>d.active_area?.status==='known_zero');el('area').textContent=zero?'0.00 mm²':hasSDF?'未求解':(a.patches.filter(p=>p.dimension===2&&p.classification==='active').reduce((s,p)=>s+p.area_m2,0)*1e6).toFixed(2)+' mm²';el('activemetric').title=zero?'独立网格距离检查确认正间隙超过几何与位姿误差，因此实际接触面积为零。':hasSDF?'SDF 后端尚未提取零间隙接触区域；不能用 near 带面积替代，也不能将未求解当作零。':'已识别的 active 区域面积。';el('overlap').textContent=[...new Set(a.pair_diagnostics.map(d=>d.overlap.status))].join(', ');el('count').textContent=a.patches.length;el('unknown').textContent=(a.pair_diagnostics.reduce((s,d)=>s+(d.unresolved_area_m2||0),0)*1e6).toFixed(2)+' mm²';el('patches').replaceChildren();el('detail').textContent='';

el('regionmetric').hidden=true;el('regiontimemetric').hidden=true;
